# ---------------------------------------------------------------------------
# CLASSIFICAÇÃO DOS EXTRATOS POR REGRA (E6b)
# Cada regra: padrao (regex sobre a descrição normalizada: maiúsculas, sem acento, espaços
# simples), sinal (+ entrada, − saída), conta (contrapartida analítica), e opcionalmente
# lojista: true (o nome depois do padrão tem que ser um lojista do cadastro, por prefixo exato),
# mes_anterior: true (o grupo `mes` tem que ser o mês anterior à competência do extrato) e
# pendencia (texto: a linha é classificada e também vira pendência).
# Avaliadas na ordem abaixo; a primeira que casa vale. Nunca citam número de linha.
# ---------------------------------------------------------------------------

