    status: ASSUMO
    fonte: "taxas da Ponte com 4 casas, ruído até 0,0016 p.p.; a Helena aceitou critério nosso escrito com motivo (Slack Helena 20:58)"
    pergunta_ref: null
  participacao_tarvo:       # comissão REMESSA = 50% do Spread R$ realizado
    valor: 0.50
    status: CONFIRMADO
    fonte: "Slack Helena 20:48 (e 03_email corpo: 'participação de 50% (cinquenta por cento) do spread realizado')"
    pergunta_ref: null
  base_participacao:
    valor: SPREAD_REALIZADO   # coluna 'Spread R$', não 'Spread Estimado R$ (D-1)'
    status: CONFIRMADO
    fonte: "Slack Helena 20:48 (e 03_email corpo: 'do spread realizado')"
    pergunta_ref: null
  tomador_nf_remessa:
    valor:
      cnpj: "75374179000146"
      nome: "Ponte Câmbio S.A."
      quantidade: "1 nota por mês"
      valor_nota: "total da participação do mês"
      discriminacao: "serviço + competência"
    status: CONFIRMADO
    fonte: "Slack Helena 20:47"
    pergunta_ref: P03
  status_ressalva_segue_liquidacao:
    valor: true
