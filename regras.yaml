    valor:
      VENDA: "entra (bruto × taxa contratada)"
      ESTORNO: "entra, abatendo, pela taxa contratada da venda original"
      ANTECIPACAO: "entra (mesma regra: bruto × taxa contratada de antecipação)"
      REVERSAO ANTECIPACAO: "só anula a taxa da antecipação referenciada (id_referencia)"
    status: CONFIRMADO
    fonte: >-
      Slack Helena 20:47. Verificado nos dados (16/10 ~21h): a Orbe aplica 2,10% sobre o valor_bruto da
      própria linha de ANTECIPACAO, truncado (44 linhas: 27 só truncamento, 17 ambos, 0 só arredondamento);
      as 6 reversões espelham bruto e taxa da antecipação referenciada. A linha de antecipação não tem
      vínculo com as vendas antecipadas: a base disponível é o valor_bruto da linha
    pergunta_ref: null
  estorno:
