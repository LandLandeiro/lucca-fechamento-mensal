    valor:
      criterio: >-
        só lojista sem histórico (sem vigência na planilha antes do mês e sem nenhuma linha com data_venda_original
        anterior ao mês): exposição por data = antecipações − reversões − (vendas − estornos), acumulados no mês até a
        data; com pico > 0, alerta com o valor e a data do pico (D73; antes, a primeira data em que passava)
      quem_decide: "Helena + comercial"
      citacao: "Isso não deveria acontecer. A antecipação é sobre o que o lojista já vendeu, e a gente não tem trava para isso. Coloquem como alerta: quem precisa saber sou eu e o comercial, e ainda mais com a Atlas sem contrato assinado."
      citacao_fonte: "Helena 09:44, Q-N 6"
      criterio_citacao: "O que me preocupa é lojista novo, sem histórico, antecipando alto. Não temos um limite definido. O critério é de vocês"
      criterio_fonte: "Helena 11:37, Q-AA 2"
    status: ASSUMO
    autor: Lucca
    aceite: "Helena 11:37 (Q-AA 2): 'O que me preocupa é lojista novo, sem histórico, antecipando alto ... O critério é de vocês: escrevam no HIPOTESES.md'; 11:49 (Q-AE 3): 'Esse critério é de vocês. O alerta é para mim e para o comercial e não muda nenhum número'; 12:50 (Q-AG, alerta pelo pico): 'A proposta é razoável: registrem no HIPOTESES.md e sigam'"
    fonte: >-
      decisão Lucca 17/10 (D66) sobre a Q-N 6. Motivo do recorte: para lojista com histórico a antecipação cobre
      recebíveis de meses anteriores, que não estão nos dados; o critério do mês inteiro daria alarme falso em 5
      lojistas (Oxford Prep, Kiwi Experience, Dublin Hub, Canguru, Mundo Aberto), e a Helena pediu 'não receber
      alarme de centavo' (Q-G, 20:58). Checar todos exige a agenda de recebíveis da Orbe. Em setembro: só a Atlas
      (179.592,82 antecipados em 15/09 × 55.357,50 vendidos até a data)
