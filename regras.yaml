# Regras do fechamento da Tarvo — regra de negócio é DADO, não código.
#
# Cada regra tem:
#   valor        o que o código usa (null só quando status = PENDENTE → o cálculo dependente vira pendência)
#   status       SEI (está nos dados) | ASSUMO (premissa registrada em HIPOTESES.md) |
#                CONFIRMADO (o financeiro respondeu) | PENDENTE (sem valor; ninguém decidiu ainda)
#   fonte        arquivo + linha/célula, ou "Slack Helena HH:MM" para resposta do financeiro
#   pergunta_ref P01..P10 = tabela de perguntas em HIPOTESES.md; null se não há pergunta
#
# Nada aqui pode ser preenchido pelo código ou pela IA: quem decide é o Lucca (com o financeiro).
# Validação da estrutura: src/tarvo/regras.py (carregar_regras).

# ---------------------------------------------------------------------------
# FATOS DOS DADOS (SEI) E PREMISSAS (ASSUMO)
# ---------------------------------------------------------------------------

orbe:
  arredondamento_valor_taxa:
    valor: TRUNCAR          # a Orbe calcula valor_taxa = bruto × taxa_aplicada truncado em 2 casas (ROUND_DOWN sobre o valor absoluto)
    status: SEI
    fonte: "01_orbe: 1.001 linhas só fecham truncando, 0 arredondando (ex.: TX88410128 5.773,57 × 3,79% = 218,818 → 218,81)"
    pergunta_ref: null
  ajustes_tardios:          # D75
    valor: >-
      06_orbe_ajustes_tardios_<mês>.csv, mesmo formato do 01, é parte do relatório da Orbe do mês: lido junto, com o
      próprio arquivo no rastro; opcional (se faltar, segue com aviso informativo, D89). Cada linha passa pelas mesmas regras (estorno,
      reversão, venda)
    status: SEI
    fonte: "mensagem da organização 17/10 13:10: 'A Orbe mandou os ajustes de setembro que ficaram fora do relatório ... no mesmo formato do arquivo 01 ... O fechamento entregue às 18h30 precisa considerar esse arquivo.' Opcional: decisão Lucca 17/10; Helena 13:34 (Q-AJ 1): 'Vem quando a Orbe tem ajuste, não todo mês.'"
    pergunta_ref: P40
  mes_do_ajuste_tardio:     # D91
    valor: >-
      o ajuste que chega antes da aprovação do fechamento entra no mês do movimento (como em setembro); depois da
      aprovação, entra no mês seguinte. Quem diz que o mês anterior já foi aprovado é uma pessoa, com a opção
      --fechamento-anterior-aprovado: a linha do 06 com movimento no mês anterior entra no mês corrente, com aviso.
      Sem a opção, a linha de outro mês fica fora da comissão e vira pendência ORBE_FORA_COMPETENCIA (D62)
    status: CONFIRMADO
    aprovado_por: "Helena"   # Q-S: regra de fechamento = Helena
    fonte: "Slack Helena 13:34 (Q-AJ 1): 'Se chega antes de eu aprovar o fechamento, entra no mês do movimento, como agora. Se chegar depois da aprovação, entra no mês seguinte.' A opção da linha de comando é decisão Lucca 17/10 (D91)"
    pergunta_ref: P40
  id_repetido_entre_arquivos:   # D75
    valor: "id_transacao em mais de um arquivo da Orbe (01 e 06): nenhuma das linhas conta; pendência ID_REPETIDO_ORBE para a Helena"
    status: ASSUMO
    autor: Lucca
    fonte: "decisão Lucca 17/10 (D75). Não acontece em setembro"
    aceite: "Helena 13:34 (Q-AJ 2): 'Correção de uma linha com o mesmo id nunca aconteceu. Se acontecer, o critério é de vocês: deixem claro no `HIPOTESES.md` e mostrem a pendência para mim.'"
    pergunta_ref: P40
