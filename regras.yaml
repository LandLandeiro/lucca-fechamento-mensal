    aprovado_por: "Helena"   # Q-S: regra de fechamento = Helena
    fonte: "Slack Helena 13:34 (Q-AI): 'Vale pela data da antecipação. A antecipação é um serviço que a gente presta no dia em que ela acontece: se foi em setembro, está dentro da isenção. Não precisa ir atrás das vendas de origem.' Caso: as 4 antecipações da Casa (AN88445172 09/09, AN88445486 11/09, AN88445740 15/09, AN88445802 16/09) com taxa 0"
