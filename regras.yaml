# Regras do fechamento da Tarvo — regra de negócio é DADO, não código.
#
# Cada regra tem:
#   valor        o que o código usa (null só quando status = PENDENTE → o cálculo dependente vira pendência)
#   status       SEI (está nos dados) | ASSUMO (premissa registrada em HIPOTESES.md) |
#                CONFIRMADO (o financeiro respondeu) | PENDENTE (sem valor; ninguém decidiu ainda)
#   fonte        arquivo + linha/célula, ou "Slack Helena HH:MM" para resposta do financeiro
#   pergunta_ref P01..P10 = tabela de perguntas em HIPOTESES.md; null se não há pergunta
#
# Nada aqui pode ser preenchido pelo código ou pela IA: quem decide é o Lucca (com o financeiro).
# Validação da estrutura: src/tarvo/regras.py (carregar_regras).

# ---------------------------------------------------------------------------
# FATOS DOS DADOS (SEI) E PREMISSAS (ASSUMO)
# ---------------------------------------------------------------------------

orbe:
  arredondamento_valor_taxa:
    valor: TRUNCAR          # a Orbe calcula valor_taxa = bruto × taxa_aplicada truncado em 2 casas (ROUND_DOWN sobre o valor absoluto)
    status: SEI
    fonte: "01_orbe: 1.001 linhas só fecham truncando, 0 arredondando (ex.: TX88410128 5.773,57 × 3,79% = 218,818 → 218,81)"
    pergunta_ref: null
  liquido_igual_bruto_menos_taxa:
    valor: true
    status: SEI
    fonte: "01_orbe: confere em 1943/1943 linhas"
    pergunta_ref: null

taxas:
  aba_vigente:
    valor: "Taxas vigentes"
    status: SEI
    fonte: "02_taxas: abas 'Taxas vigentes' e 'ANTIGO 2025 - nao usar'"
    pergunta_ref: null
  coluna_por_produto:
    valor:                  # modalidade/faixa da Orbe → cabeçalho da planilha (R5)
      DEBITO: "Débito"
      CREDITO A VISTA: "Crédito à vista"
      CREDITO PARCELADO 2-6: "Créd. 2-6x"
      CREDITO PARCELADO 7-12: "Créd. 7-12x"
      PIX: "Pix"
      ANTECIPACAO: "Antecipação"
      REMESSA: "Spread remessa"
    status: SEI
    fonte: "02_taxas R5 (cabeçalho) × 01_orbe colunas modalidade/qtd_parcelas"
    pergunta_ref: null
  casas_decimais_taxa:
    valor: 4                # fração (0.0269); remove o ruído de float (0.007900000000000001)
    status: SEI
    fonte: "02_taxas: todas as taxas são múltiplos de 0,0001 (ex.: R14 H = 0.007900000000000001)"
    pergunta_ref: null

ponte:
  formula_spread_pct:
    valor: "(taxa_cliente - ptax_ref) / ptax_ref"
    status: SEI
    fonte: "anexo Operações: confere em 233/233 linhas; Spread R$ = ME × (TC − PTAX), Valor R$ = ME × TC"
    pergunta_ref: null
  tolerancia_spread_pct:
    valor: 0.00005          # fração: 0,005 p.p.; menor diferença contratual real observada: 0,0005
    status: ASSUMO
    fonte: "taxas da Ponte com 4 casas, ruído até 0,0016 p.p."
    pergunta_ref: null
  participacao_tarvo:
    valor: 0.50
    status: SEI
    fonte: "03_email corpo: 'participação de 50% (cinquenta por cento) do spread realizado'"
    pergunta_ref: null
  base_participacao:
    valor: SPREAD_REALIZADO   # coluna 'Spread R$', não 'Spread Estimado R$ (D-1)'
    status: SEI
    fonte: "03_email corpo: 'do spread realizado'"
    pergunta_ref: null
  tomador_nf_remessa:
    valor: {cnpj: "75374179000146", nome: "Ponte Câmbio S.A."}
    status: ASSUMO
    fonte: "e-mail Ponte: 'mediante recebimento da nota fiscal de intermediação'"
    pergunta_ref: null
  status_ressalva_segue_liquidacao:
    valor: true
    status: SEI
    fonte: "03_email corpo: 'Lembramos que operações com status \"APROVADO C/ RESSALVA\" seguem normalmente para liquidação.'"
    pergunta_ref: null
  linhas_que_nao_sao_dados:
    valor: ["Total de operações:", "Spread total R$:"]
    status: SEI
    fonte: "anexo Operações R240–R241"
    pergunta_ref: null

plano_contas:
  contas_lancaveis:
    valor: "ACEITA_LANCTO = S"
    status: SEI
    fonte: "04_plano: colunas TIPO (SINTETICA/ANALITICA) e ACEITA_LANCTO"
    pergunta_ref: null

extratos:
  ref_origem_aurora:
